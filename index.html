<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis Young</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: #0f172a;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: #f5eee2;
    color: #0f172a;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 600;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 26px; margin-bottom: 14px; }
  .promo { color: #e8192c; font-size: 24px; font-weight: 800; margin-bottom: 22px; letter-spacing: .3px; }
  a.btn {
    display: block;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    background: #f1f5f9;
    color: #0f172a;
    word-break: break-all;
  }
  a.btn:active { background: #e2e8f0; }
  a.primary { background: #0f172a; color: #fff; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"><img src="logo.png" alt="Travis Young" onerror="this.parentNode.textContent='TY'"></div>
    <h1>Travis Young</h1>
    <div class="promo">2 Months Free</div>

    <a class="btn" href="tel:+14125678777">📞 412-567-8777</a>
    <a class="btn" href="sms:+14125678777">💬 Text Me</a>
    <a class="btn" href="mailto:verizonfibernow@gmail.com">✉️ verizonfibernow@gmail.com</a>

    <a class="btn primary" id="save" href="#">Save to Contacts</a>
  </div>

<script>
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Young;Travis;;;",
    "FN:Travis Young",
    "TEL;TYPE=CELL:+14125678777",
    "EMAIL:verizonfibernow@gmail.com",
    "END:VCARD"
  ].join("\r\n");

  var link = document.getElementById("save");
  link.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
  link.download = "Travis-Young.vcf";
</script>
<script data-goatcounter="https://verizonfiber.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
